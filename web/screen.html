<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tgiFlyDay · Spectator view</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<style>body.idle { cursor: none; }</style>
</head>
<body>
<div class="offline-banner">Reconnecting…</div>
<div id="screen" class="pb">
  <div class="chequer"></div>
  <header class="pb-head">
    <div class="logo" id="viewToggle" title="Switch view"><img src="/assets/mark-small.svg" alt=""><span class="wm"><small>TGI</small><span id="wmWord">Fly</span><b>Day</b></span></div>
    <span id="meta" class="meta">Practice</span>
    <span id="wallclock" class="wallclock num"></span>
    <div class="pb-qr" title="Your heat on your phone"><span>Your heat<br>on your phone</span><i id="meQr"></i></div>
    <button id="signinBtn" class="pb-signin">Sign in</button>
    <span id="langSw"></span>
  </header>
  <div id="main" class="pb-main"></div>
  <div id="next" class="pb-next"></div>
</div>

<!-- The kiosk, opened over the big screen when kiosk and screen share one PC. -->
<div id="signin" class="pb-signin-overlay">
  <div class="pb-signin-panel">
    <button id="signinClose" class="pb-signin-close" aria-label="Close">✕</button>
    <iframe id="signinFrame" title="Pilot sign-in" allow="camera; autoplay"></iframe>
  </div>
</div>

<script type="module">
import { connect, clockMs, fmt, SLOT_COLORS, esc, pilotMap, wallClock, NAME, photoUrl, meUrl, qrSvg, timerMark, faceOf, nightPrompt, tr, langSwitch, LANG } from '/assets/common.js';

// Spectator view: a pit board. Big planks for the heat and the clock, race plates for the
// line-up, and the next heat on the orange board while a heat flies.
const $ = (id) => document.getElementById(id);
$('langSw').innerHTML = langSwitch('head');
let state = null;

const WORD = {
  changeover: 'Up next',
  arming: 'Arm your quads',
  running: 'Flying',
  freeflight: 'Free flight',
  paused: 'Paused',
};

/** A little club quad mark before the name of a pilot flying one of the club's quads. */
function clubMark(p) {
  const q = (state.config.clubQuads ?? []).find((c) => c.name.toLowerCase() === p.quad?.toLowerCase());
  return q ? `<i class="club-q" title="Club quad ${esc(q.name)}"></i>` : '';
}

function plates(heat, pm) {
  // Only the pilots who fly: empty slots aren't shown.
  return `<div class="plates">${heat.slots.map((s, i) => {
    const p = s.pilotId ? pm.get(s.pilotId) : null;
    const c = `--c:${SLOT_COLORS[i]}`;
    if (!p) return '';
    // A photo, or the pilot's goggled animal (darkened).
    const face = faceOf(state, p, true);
    const img = face.src;
    return `<div class="plate ${img ? 'photo' : ''} ${face.avatar ? 'avatar' : ''}" style="${c}">
      ${img ? `<img src="${img}" alt="" ${face.avatar ? 'class="avatar"' : ''}>` : ''}
      <span class="ch">${esc(s.channel)}${timerMark(state, i)}</span><span class="nm">${clubMark(p)}${esc(NAME(p.callsign))}</span>
    </div>`;
  }).join('')}</div>`;
}

// ---------- TrackDay view: the clock and a QR code (tap the logo to switch) ----------
// The RC car days: the screen says TGI TrackDay and shows how to pay for the track day.
// It switches to it by itself every Wednesday, Saturday and Sunday at 09:00 (once a day,
// so tapping back to tgiFlyDay that day sticks).

/**
 * The two QR codes of the TrackDay view: paying for the track day (main pane) and joining the
 * club (thank-you pane).
 */
const CARDS = [
  // The pay address comes from Flyday (state.trackdayUrl, contracts/trackday-pay.md); this is the fallback.
  { title: 'Did you pay for this track day?', price: 'Track day 15 EUR', cta: 'Scan to pay', url: 'https://pay.montonio.com/3di-bmx-ofqo', builtIn: 'https://pay.montonio.com/3di-bmx-ofqo' },
  { title: 'Join the club', price: 'Track days for free ;)', cta: 'Scan to join HOBIzone', url: 'https://www.hobizone.org/liitu', builtIn: 'https://www.hobizone.org/liitu', cls: 'join' },
];
let view = (() => { try { return localStorage.getItem('tgiflyday.screen.view') || 'plates'; } catch { return 'plates'; } })();
const cardQr = new Map();
/**
 * Switch between tgiFlyDay and TrackDay with a transition, never a jump: the board, the panel
 * and the header's logo and extras fade and settle out, the view changes while they're
 * hidden, then they come back in. The clock in the header stays put.
 */
const VIEW_FADE_MS = 420;
let switching = false;
function setView(v) {
  if (v === view || switching) return;
  try { localStorage.setItem('tgiflyday.screen.view', v); } catch {}
  switching = true;
  $('screen').classList.add('view-leave');
  setTimeout(() => {
    view = v;
    render();
    // Let the new view lay out hidden, then bring it in.
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $('screen').classList.remove('view-leave');
      setTimeout(() => { switching = false; }, VIEW_FADE_MS);
    }));
  }, VIEW_FADE_MS);
}
$('viewToggle').addEventListener('click', () => setView(view === 'plates' ? 'pay' : 'plates'));

const TRACK_DAYS = [3, 6, 0]; // Wednesday, Saturday, Sunday
const TRACK_FROM = 9 * 60;    // 09:00
function trackDaySchedule() {
  const d = new Date();
  if (!TRACK_DAYS.includes(d.getDay()) || d.getHours() * 60 + d.getMinutes() < TRACK_FROM) return;
  const today = d.toDateString();
  let done = '';
  try { done = localStorage.getItem('tgiflyday.screen.trackday') || ''; } catch {}
  if (done === today) return;
  try { localStorage.setItem('tgiflyday.screen.trackday', today); } catch {}
  if (view !== 'pay') setView('pay');
}
setInterval(trackDaySchedule, 30_000);

// ---------- TrackDay screen (Janno 17.11.2026): clock, this week's calendar, both QR codes;
// taking turns with the thank-you screen (45 s / 20 s). The calendar and the names come from
// the portal through the RD PC (state.trackdayScreen); `?demo` shows made-up data until then.
const DEMO = new URLSearchParams(location.search).has('demo');
const TD_MAIN_MS = 45_000, TD_THANKS_MS = 20_000, TD_HOLD_MS = 60_000;
let tdPane = 'main', tdSince = Date.now(), tdHoldUntil = 0, tdWeek = 0, tdShown = 0;
const pick = (v) => (v && typeof v === 'object' ? v[LANG] ?? v.en ?? v.et ?? '' : v ?? '');
const two = (n) => String(n).padStart(2, '0');
const hhmm = (d) => `${two(d.getHours())}:${two(d.getMinutes())}`;
function mondayOf(d) { const m = new Date(d); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
}

/** Made-up week, the same shape the portal will send. */
function demoData() {
  const mon = mondayOf(new Date());
  const at = (day, h, m = 0) => { const d = new Date(mon); d.setDate(d.getDate() + day); d.setHours(h, m); return d.toISOString(); };
  const events = [];
  for (const w of [-7, 0, 7, 14]) {
    const e = (day, h1, m1, h2, m2, kind, title) => events.push({ id: `${w}-${day}-${h1}`, start: at(day + w, h1, m1), end: at(day + w, h2, m2), kind, title });
    e(0, 17, 30, 20, 0, 'drone', { et: 'Droonitrenn', en: 'Drone practice' });
    e(1, 16, 0, 17, 30, 'class', { et: 'Droonide huviring', en: "Kids' drone class" });
    e(2, 9, 0, 21, 0, 'track', { et: 'Rajapäev', en: 'Track day' });
    e(3, 17, 30, 20, 0, 'drone', { et: 'Droonitrenn', en: 'Drone practice' });
    e(4, 18, 0, 21, 0, 'other', { et: 'Ehitusõhtu', en: 'Build night' });
    e(5, 10, 0, 18, 0, 'track', { et: 'Rajapäev', en: 'Track day' });
    if (w === 0) e(5, 12, 0, 15, 0, 'other', { et: 'RC-autode võistlus', en: 'RC car race' });
    e(6, 10, 0, 16, 0, 'track', { et: 'Rajapäev', en: 'Track day' });
  }
  const names = ['Karl', 'Sven', 'Mari', 'Liis', 'Kristjan', 'Mia', 'Leo', 'Rasmus', 'Hanna', 'Oskar', 'Laura', 'Markus', 'Eliise', 'Robin', 'Kaspar', 'Grete', 'Martin', 'Sofia', 'Andres', 'Kertu', 'Joonas', 'Emma', 'Tanel', 'Maria', 'Siim', 'Anna', 'Rein', 'Helen', 'Marko', 'Kadri', 'Funrent', 'Velvet', 'Priit', 'Triin', 'Aivar', 'Elisabeth', 'Henri', 'Johanna', 'Kevin', 'Merilin', 'Tõnu', 'Ülle', 'Jüri', 'Katrin', 'Taavi', 'Pille', 'Erik', 'Hobipood', 'Janek', 'Signe', 'Mihkel', 'Lisette', 'Toomas', 'Getter', 'Artur', 'Liisa'];
  const mixed = names.map((name) => ({ name, new: false })).sort(() => Math.random() - 0.5);
  mixed.splice(7, 0, { name: 'Karl', new: true });
  mixed.splice(30, 0, { name: 'Laura', new: true });
  return {
    events,
    updated: new Date(Date.now() - 12 * 60_000).toISOString(),
    thanks: { title: { et: 'Aitäh, et hoiate seda paika lahti!', en: 'Thank you for keeping this place open!' }, names: mixed },
  };
}
const tdData = () => state?.trackdayScreen ?? (DEMO ? demoData() : null);

function calendarHtml(data) {
  const mon = mondayOf(new Date());
  mon.setDate(mon.getDate() + tdWeek * 7);
  const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
  const today = new Date().toDateString();
  const loc = LANG === 'et' ? 'et-EE' : 'en-GB';
  const range = `${mon.getDate()}.${mon.getMonth() + 1}–${sun.getDate()}.${sun.getMonth() + 1}`;
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(mon); d.setDate(d.getDate() + i); return d; });
  const cols = days.map((d) => {
    const evs = (data?.events ?? [])
      .filter((e) => new Date(e.start).toDateString() === d.toDateString())
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    const items = evs.map((e) => {
      const st = new Date(e.start), en = e.end ? new Date(e.end) : null;
      const when = e.all_day ? tr('All day') : `${hhmm(st)}${en ? `–${hhmm(en)}` : ''}`;
      return `<div class="ev ${esc(e.kind ?? 'other')}${e.cancelled ? ' off' : ''}"><span class="t num">${when}${e.cancelled ? ` · ${tr('cancelled')}` : ''}</span><b>${esc(pick(e.title))}</b></div>`;
    }).join('');
    return `<div class="day ${d.toDateString() === today ? 'today' : ''}">
      <div class="dh"><span>${d.toLocaleDateString(loc, { weekday: 'short' }).replace('.', '')}</span><b class="num">${d.getDate()}</b></div>
      <div class="evs">${items || '<i class="none">–</i>'}</div></div>`;
  }).join('');
  const upd = data?.updated ? tr('updated {time}', { time: hhmm(new Date(data.updated)) }) : '';
  return `<div class="td-cal">
    <div class="cal-head">
      <button class="wk" data-week="-1" aria-label="${tr('Previous week')}">‹</button>
      <div class="cal-title"><b>${tdWeek === 0 ? tr('This week') : tr('Week {n}', { n: isoWeek(mon) })}</b><span class="num">${range}</span></div>
      <button class="wk" data-week="1" aria-label="${tr('Next week')}">›</button>
      <span class="upd">${upd}</span>
    </div>
    ${data ? `<div class="cal-days">${cols}</div>` : `<p class="cal-none">${tr('The calendar comes from hobizone.org once the timing PC has heard from it.')}</p>`}
  </div>`;
}

function qrCardHtml(card, i, cls) {
  if (!cardQr.has(card.url)) {
    cardQr.set(card.url, '');
    qrSvg(card.url).then((svg) => { cardQr.set(card.url, svg); for (const el of document.querySelectorAll(`[data-qr="${i}"]`)) el.innerHTML = svg; });
  }
  return `<div class="td-qr ${cls}"><div class="pay-qr" data-qr="${i}">${cardQr.get(card.url)}</div>
    <div class="txt"><h2>${esc(tr(card.title))}</h2><p class="price">${esc(tr(card.price))}</p><p class="cta">${esc(tr(card.cta))}</p></div></div>`;
}

/**
 * The thank-you names, scattered like a word cloud (Janno 17.11.2026): mixed order (the portal
 * shuffles, and we shuffle again every time the pane comes up), a few sizes and a little tilt and
 * offset each, so they never read as rows. People and companies alike; paid today = orange.
 */
function cloud(names) {
  const list = names.map((n) => (typeof n === 'string' ? { name: n, new: false } : n));
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  const SIZES = [0.72, 0.86, 1, 1, 1.16, 1.34];
  return list.map((n) => {
    const size = SIZES[Math.floor(Math.random() * SIZES.length)];
    const shift = (Math.random() * 0.24 - 0.12).toFixed(2);
    const tilt = (Math.random() * 6 - 3).toFixed(1);
    const tone = n.new ? 'new' : ['t1', 't2', 't3'][Math.floor(Math.random() * 3)];
    return `<span class="${tone}" style="font-size:${size}em;transform:translateY(${shift}em) rotate(${tilt}deg)">${esc(n.name)}</span>`;
  }).join('');
}

/** The same scatter for as long as the pane is up; a new one each time it comes back or the names change. */
let cloudKey = '', cloudHtml = '';
function cloudFor(t) {
  const key = `${tdShown}|${t.updated ?? ''}|${t.names.length}|${LANG}`;
  if (key !== cloudKey) { cloudKey = key; cloudHtml = cloud(t.names); }
  return cloudHtml;
}

function thanksHtml(data) {
  const t = data?.thanks;
  // No names from the portal yet: Join the club on its own.
  if (!t?.names?.length) return `<div class="td-join-only">${qrCardHtml(CARDS[1], 1, 'join')}</div>`;
  return `<div class="td-thanks"><h1>${esc(pick(t.title))}</h1>
    <div class="names" id="tdNames">${cloudFor(t)}</div></div>
    <div class="td-right">${qrCardHtml(CARDS[1], 1, 'join')}</div>`;
}
/** The biggest text at which every name fits in its box: no scrolling, no empty half-screen. */
function fitNames() {
  const box = document.getElementById('tdNames');
  if (!box) return;
  let lo = 8, hi = 400;
  for (let k = 0; k < 18; k++) {
    const mid = (lo + hi) / 2;
    box.style.fontSize = `${mid}px`;
    if (box.scrollHeight <= box.clientHeight && box.scrollWidth <= box.clientWidth) lo = mid; else hi = mid;
  }
  box.style.fontSize = `${lo}px`;
}

let tdKey = '';
function renderTrackDay(force = false) {
  const data = tdData();
  // States come several times a second during a session: redraw only when something shown changed.
  const key = [tdPane, tdWeek, tdShown, data?.updated, data?.thanks?.updated, state?.trackdayUrl, LANG, new Date().toDateString(), $('main').className].join('|');
  if (!force && key === tdKey && $('main').querySelector('.td-left, .td-thanks, .td-join-only')) return;
  tdKey = key;

  CARDS[0].url = state?.trackdayUrl || CARDS[0].builtIn;
  CARDS[1].url = pick(data?.join_url) || CARDS[1].builtIn;
  const now = new Date();
  $('main').className = 'pb-main td2';
  $('main').innerHTML = tdPane === 'thanks' ? thanksHtml(data) : `
    <div class="td-left">
      <div class="td-clock"><div class="cl"><span id="dayClock" class="bigclock num">${dayClock()}</span></div>
        <span class="date">${now.toLocaleDateString(LANG === 'et' ? 'et-EE' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</span></div>
      ${calendarHtml(data)}
    </div>
    <div class="td-right">${qrCardHtml(CARDS[0], 0, 'pay')}</div>`;
  $('main').classList.toggle('td-thanks-pane', tdPane === 'thanks');
  if (tdPane === 'thanks') requestAnimationFrame(fitNames);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-week]');
  if (!b) return;
  tdWeek = Math.max(-1, Math.min(2, tdWeek + Number(b.dataset.week)));
  tdHoldUntil = Date.now() + TD_HOLD_MS;
  renderTrackDay(true);
});
addEventListener('resize', () => requestAnimationFrame(fitNames));
setInterval(() => {
  const c = state?.clock;
  if (view !== 'pay' || !c) { tdPane = 'main'; tdSince = Date.now(); return; }
  if (Date.now() < tdHoldUntil) { tdSince = Date.now(); return; }
  if (tdWeek !== 0 && tdPane === 'main' && Date.now() - tdSince > TD_HOLD_MS) { tdWeek = 0; renderTrackDay(true); }
  const due = tdPane === 'main' ? TD_MAIN_MS : TD_THANKS_MS;
  if (Date.now() - tdSince < due) return;
  const next = tdPane === 'main' ? 'thanks' : 'main';
  tdSince = Date.now();
  if (next === tdPane) return;
  $('main').classList.add('td-fade');
  setTimeout(() => { tdPane = next; tdWeek = 0; tdShown++; renderTrackDay(true); requestAnimationFrame(() => $('main').classList.remove('td-fade')); }, 420);
}, 500);
// For screenshots and checking: ?pane=thanks opens on the thank-you screen.
if (new URLSearchParams(location.search).get('pane') === 'thanks') tdPane = 'thanks';

/** The big time of day, for the TrackDay view when no drone practice runs. */
function dayClock() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
setInterval(() => {
  const el = document.getElementById('dayClock');
  if (!el) return;
  if (el.textContent !== dayClock()) el.textContent = dayClock();
  fitClock(el);
}, 1000);

/**
 * Back to work: while a session runs, every new phase (changeover, arm, heat on, heat over)
 * brings TrackDay back to the tgiFlyDay view. Not on the first state after loading the page.
 */
let lastPhase = null;
function backToWork(c) {
  const phase = `${c.phase}|${c.heat}|${c.paused}`;
  const changed = lastPhase !== null && phase !== lastPhase;
  lastPhase = phase;
  const running = c.phase !== 'stopped' && c.phase !== 'waiting';
  if (changed && running && view === 'pay') setTimeout(() => setView('plates'), 0);
}

function render() {
  if (!state) return;
  nightPrompt(state, 'big');
  const c = state.clock;
  backToWork(c);
  const screen = $('screen');
  screen.classList.toggle('pay-view', view === 'pay');
  $('wmWord').textContent = view === 'pay' ? 'Track' : 'Fly';
  const mark = view === 'pay' ? '/assets/mark-car-small.svg' : '/assets/mark-small.svg';
  const markImg = document.querySelector('#viewToggle img');
  if (!markImg.src.endsWith(mark)) markImg.src = mark;
  // TrackDay is for the RC cars: no drone bits in the header (sign in, the phone QR).
  screen.classList.toggle('car-day', view === 'pay');
  document.title = view === 'pay' ? 'TGI TrackDay' : 'tgiFlyDay · Spectator view';
  // The end time, if the RD set one: "until 20:00", then "last round".
  const hm = (ms) => { const d = new Date(ms); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const ends = c.lastRound ? ' · Last round' : c.finishAt ? ` · until ${hm(c.finishAt)}` : '';
  $('meta').textContent = c.phase === 'stopped' || c.phase === 'waiting' ? 'Practice' : `Practice · Round ${c.round}${ends}`;

  // TrackDay: the pay / thank-you cycle, with or without a drone session (Janno 17.11.2026).
  if (view === 'pay') {
    screen.classList.add('no-next');
    $('next').innerHTML = '';
    return renderTrackDay();
  }
  if (c.phase === 'stopped' || c.phase === 'waiting') {
    screen.classList.add('no-next');
    $('next').innerHTML = '';
    const msg = c.phase === 'waiting' ? 'Waiting for pilots · join a heat at the kiosk' : 'Practice is not running';
    const idle = `<div class="logo"><img src="/assets/mark.svg" alt=""><span class="wm"><small>TGI</small>Fly<b>Day</b></span></div><p>${msg}</p>`;
    $('main').className = 'pb-idle';
    $('main').innerHTML = idle;
    return;
  }
  const pm = pilotMap(state);
  const key = c.paused ? 'paused' : c.phase;
  $('main').className = 'pb-main';
  $('main').innerHTML = `
    <div class="pb-board">
      <div class="plank top"><span class="heat">HEAT ${c.heat + 1}</span><span class="word ${key}">${tr(WORD[key]).toUpperCase()}</span></div>
      <div class="plank clock-plank"><span id="bigclock" class="bigclock num"></span></div>
      <div class="plank bar"><span id="barLabel" class="label"></span><div class="track"><div id="barFill" class="fill"></div></div></div>
    </div>
    ${plates(state.heats[c.heat], pm)}`;
  renderNext(pm);
  tick();
}

/** While a heat flies, the next heat's pilots see they're up and get ready. */
function renderNext(pm) {
  const c = state.clock;
  const n = c.phase === 'running' && state.nextHeat != null ? state.heats[state.nextHeat] : null;
  const pilots = n ? n.slots.map((s, i) => ({ p: s.pilotId ? pm.get(s.pilotId) : null, ch: s.channel, i })).filter((x) => x.p) : [];
  $('screen').classList.toggle('no-next', !pilots.length);
  if (!pilots.length) { $('next').innerHTML = ''; return; }
  $('next').innerHTML = `
    <div class="tag"><span>GET READY</span><b>${n.index === c.heat ? 'SAME HEAT' : `HEAT ${n.index + 1}`}</b></div>
    <div class="list">${pilots.map((x) => `<div class="who"><span>${esc(x.ch)}${timerMark(state, x.i)}</span><b>${clubMark(x.p)}${esc(NAME(x.p.callsign))}</b></div>`).join('')}</div>`;
}

function tick() {
  if (!state) return;
  $('wallclock').textContent = wallClock(state);
  const el = $('bigclock');
  if (!el) return;
  const c = state.clock;
  const free = c.phase === 'freeflight';
  const arming = c.phase === 'arming' && !c.paused;
  const ms = clockMs(c);
  // The start BEEP comes at a random moment: never show a countdown to it.
  el.textContent = arming ? 'ARM' : fmt(ms);
  el.className = 'bigclock num' + (arming ? ' word arming' : c.phase === 'changeover' ? ' changeover' : '') +
    (c.phase === 'running' && !c.paused && ms != null && ms <= 10000 ? ' low' : '');
  fitClock(el);
  const total = c.phase === 'running' ? state.config.heatSeconds * 1000 : c.phase === 'changeover' ? state.config.changeoverSeconds * 1000 : 0;
  $('barLabel').textContent = free ? 'NO TIME LIMIT' : arming ? 'START COMING' : c.phase === 'changeover' ? 'TO START' : 'REMAINING';
  $('barFill').style.width = total && ms != null ? `${Math.max(0, Math.min(100, (ms / total) * 100))}%` : free ? '100%' : '0%';
}
setInterval(tick, 100);

/**
 * The clock is as big as the board allows: a longer time (10:00, or free flight past an
 * hour) or a narrow screen makes it shrink until it fits. Measured only when that changes.
 */
let fitKey = '', fitEl = null;
function fitClock(el) {
  const key = `${el.textContent.length}|${el.classList.contains('word')}|${innerWidth}x${innerHeight}`;
  if (key === fitKey && el === fitEl) return;
  fitKey = key;
  fitEl = el;
  el.style.fontSize = '';
  const box = el.parentElement;
  const cs = getComputedStyle(box);
  const roomW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const roomH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const range = document.createRange();
  range.selectNodeContents(el);
  const textW = range.getBoundingClientRect().width;
  const size = parseFloat(getComputedStyle(el).fontSize);
  // Digits stand about 0.75 of the font size tall.
  const scale = Math.min(1, (roomW * 0.92) / textW, (roomH * 0.92) / (size * 0.75));
  if (scale < 1) el.style.fontSize = `${size * scale}px`;
}
addEventListener('resize', () => { fitKey = ''; });
// Measured before the stencil font arrived? Measure again once it has.
document.fonts?.addEventListener('loadingdone', () => { fitKey = ''; });
document.fonts?.ready.then(() => { fitKey = ''; });

// The mouse shows while it moves and hides after 3 seconds, so it never sits on the TVs.
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
}
for (const ev of ['mousemove', 'mousedown', 'keydown']) document.addEventListener(ev, wake);
wake();

// ---------- sign in without leaving the big screen ----------
// The kiosk opens in a panel over the board; it closes by itself once the pilot is done
// (the kiosk goes back to its start), with ✕, or by tapping outside it.
const signin = $('signin');
const frame = $('signinFrame');
if (new URLSearchParams(location.search).has('nosignin')) $('signinBtn').hidden = true;
// The QR code in the header: pilots' own phone page.
meUrl().then(qrSvg).then((svg) => { $('meQr').innerHTML = svg; }).catch(() => {});

// A flyout from the right edge: the board stays in view beside it, and it slides away when done.
let closing;
function openSignin() {
  clearTimeout(closing);
  frame.src = '/kiosk?embed';
  signin.classList.add('open');
}
function closeSignin() {
  if (!signin.classList.contains('open')) return;
  signin.classList.remove('open');
  closing = setTimeout(() => { frame.src = 'about:blank'; }, 400); // also switches the webcam off
}
$('signinBtn').addEventListener('click', (e) => { e.stopPropagation(); signin.classList.contains('open') ? closeSignin() : openSignin(); });
$('signinClose').addEventListener('click', closeSignin);
// A tap on the board beside the flyout closes it too.
document.addEventListener('click', (e) => { if (!signin.contains(e.target)) closeSignin(); });
addEventListener('message', (e) => {
  if (e.origin === location.origin && e.data?.tgiflyday === 'kiosk-done') closeSignin();
});

trackDaySchedule();

connect({
  onState(s) { state = s; render(); },
  onStatus(online) { document.body.classList.toggle('offline', !online); },
});
</script>
</body>
</html>
