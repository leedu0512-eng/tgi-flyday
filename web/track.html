<style>
/* Today's track (Janno 22.11.2026): the hall in 3D to turn with a finger, the floor plan like a
   portrait A4 page, the set-up list. Edit track: generate, then move and turn pieces on the plan. */
body.trk { --ceiling: #7fc8ff; --timing: #22c55e; --display: 'Big Shoulders', 'Arial Narrow', Impact, sans-serif; --stencil: 'Big Shoulders Stencil', 'Big Shoulders', Impact, sans-serif; margin: 0; background: var(--bg); color: var(--text); font-family: 'Archivo', system-ui, sans-serif; }
.trk * { box-sizing: border-box; }
.trk .tbar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 3px solid var(--accent); }
.trk .tbar .logo { font-size: 26px; }
.trk .tbar h1 { margin: 0; font: 900 clamp(26px, 3.2vw, 40px)/1 var(--stencil); text-transform: uppercase; letter-spacing: .02em; }
.trk .tbar .code { font: 600 14px/1.2 var(--display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.trk .tbar .spacer { flex: 1; }
.trk .tb { all: unset; cursor: pointer; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font: 800 18px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.trk .tb.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.trk .tb:disabled { opacity: .4; cursor: default; }
.trk .tb:focus-visible, .trk button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.trk-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "ctrl ctrl" "stage side" "list side"; gap: 12px 14px; padding: 12px 16px 40px; align-items: start; }
.trk .ctrl { grid-area: ctrl; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.trk .ctrl[hidden] { display: none; }
.trk .field { display: grid; gap: 6px; }
.trk .field > span { font: 700 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.trk .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.trk .seg button { all: unset; cursor: pointer; padding: 11px 14px; font: 700 15px/1 'Archivo', sans-serif; color: var(--muted); background: var(--panel-2); }
.trk .seg button[aria-pressed="true"] { background: var(--accent); color: #000; }
.trk input[type="range"] { accent-color: var(--accent); width: 170px; }
.trk select { font: 600 15px 'Archivo', sans-serif; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; max-width: 260px; }
.trk .stage { grid-area: stage; position: relative; background: #050505; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: calc(100vh - 150px); min-height: 380px; touch-action: none; }
.trk.editing .stage { height: calc(100vh - 290px); }
.trk .stage canvas { display: block; width: 100%; height: 100%; }
.trk .hud { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none; }
.trk .hud > * { pointer-events: auto; }
.trk .hud .chips { flex: 0 0 100%; min-height: 31px; }
.trk .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.trk .chip { display: inline-flex; gap: .35em; align-items: baseline; background: rgba(0, 0, 0, .7); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trk .chip b { color: var(--text); }
.trk .views { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.trk .views button { all: unset; cursor: pointer; background: rgba(0, 0, 0, .75); border: 1px solid var(--line); border-radius: 8px; padding: 11px 15px; font: 800 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--text); }
.trk .views button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.trk .levels > span { font: 800 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.trk .levels button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #000; }
.trk .help { position: absolute; left: 12px; bottom: 10px; right: 12px; font-size: 14px; color: var(--muted); pointer-events: none; }
.trk .help span { background: rgba(0, 0, 0, .6); padding: 4px 10px; border-radius: 6px; }
.trk .nogl, .trk .empty { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; text-align: center; color: var(--muted); padding: 20px; font-size: 18px; }
.trk .empty b { display: block; font: 900 34px/1.1 var(--stencil); color: var(--text); text-transform: uppercase; }
.trk .side { grid-area: side; display: grid; gap: 8px; position: sticky; top: 12px; }
.trk h3 { margin: 0; font: 800 18px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; }
.trk .page { background: #050505; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.trk .page svg { display: block; height: calc(100vh - 190px); min-height: 420px; width: auto; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.trk.editing .page svg { cursor: grab; }
.trk .sel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.trk .sel .name { font: 800 18px/1 var(--display); text-transform: uppercase; letter-spacing: .05em; min-width: 9em; }
.trk .sel .muted { color: var(--muted); font-size: 14px; }
.trk .issues { grid-area: list; }
.trk .issues ul { margin: 0 0 10px; padding: 10px 14px 10px 32px; background: rgba(255, 59, 48, .08); border: 1px solid rgba(255, 59, 48, .5); border-radius: 8px; color: #ffb3ad; font-size: 15px; }
.trk .issues .ok { color: var(--timing); font-size: 15px; margin: 0 0 10px; }
.trk .list { grid-area: list; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
.trk.editing .list { margin-top: var(--issues-h, 0); }
.trk table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
.trk th, .trk td { text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.trk th { font: 700 13px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.trk td.num { text-align: right; }
.trk tr.picked td { background: rgba(255, 107, 0, .12); }
.trk .passno { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #000; font: 800 15px/1 var(--display); }
.trk .passno.t { background: var(--timing); }
.trk .toast2 { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; border: 1px solid var(--accent); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 17px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.trk .toast2.on { opacity: 1; }
@media (max-width: 900px) {
  .trk-grid { grid-template-columns: 1fr; grid-template-areas: "ctrl" "stage" "side" "list"; }
  .trk .stage, .trk.editing .stage { height: 62vh; }
  .trk .side { position: static; }
  .trk .page svg { height: auto; width: 100%; min-height: 0; }
}

<script type="module">
import { post, tr, langSwitch, esc, LANG } from '/assets/common.js';
import { HALL, RAILS, START, TIMING, TYPES, code, generate, rebuild, relayout, makeTrack, cleanEdits } from '/assets/trackgen.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const FROM_KIOSK = params.get('from') === 'kiosk';
$('lang').innerHTML = langSwitch();
if (FROM_KIOSK) $('backBtn').hidden = false;
$('backBtn').onclick = () => { location.href = '/kiosk'; };

// ---------- state ----------
let saved = { today: null, history: [] };     // from this PC
let track = null;                             // what's shown: a built track
let editing = false, picked = -1, undo = [];
let level = 'full', mode = 'orbit', rideT = 0;
const opts = { style: 'flowing', pieces: 15, rings: true, flags: true };
const bases = new Map();                       // seed+opts → generated track (edits go on top)
const baseOf = (seed, o) => {
  const k = seed + JSON.stringify(o);
  if (!bases.has(k)) bases.set(k, makeTrack(seed >>> 0, o));
  return bases.get(k);
};
const toast = (msg) => { const t = $('toast2'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3500); };

// ---------- the kiosk gets itself back after a while untouched ----------
if (FROM_KIOSK) {
  let idle;
  const arm = () => { clearTimeout(idle); idle = setTimeout(() => { location.href = '/kiosk'; }, editing ? 6 * 60_000 : 3 * 60_000); };
  for (const ev of ['pointerdown', 'keydown', 'wheel']) addEventListener(ev, arm, { capture: true, passive: true });
  arm();
}

// ---------- 3D ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Hall (x across, y up the page, z up) to three.js (y up). The page's bottom wall faces the camera.
const V = (x, y, z) => new THREE.Vector3(x - HALL.w / 2, z, HALL.l / 2 - y);
let three = null;

function setup3d() {
  const stage = $('stage');
  if (!window.THREE || !THREE.OrbitControls) { stage.insertAdjacentHTML('beforeend', `<div class="nogl">${tr('The 3D view could not start. The floor plan and set-up list still work.')}</div>`); return null; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch { stage.insertAdjacentHTML('beforeend', `<div class="nogl">${tr('This browser can\'t show 3D. The floor plan and set-up list still work.')}</div>`); return null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.Fog(0x050505, 30, 60);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 200);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 2; controls.maxDistance = 45;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(6, 12, 8); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL.w, HALL.l), new THREE.MeshLambertMaterial({ color: 0x141414 }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const grid = new THREE.GridHelper(HALL.l, HALL.l, 0x333333, 0x1f1f1f);
  grid.scale.set(HALL.w / HALL.l, 1, 1); grid.position.y = 0.002; scene.add(grid);
  const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(HALL.w, HALL.h, HALL.l)), new THREE.LineBasicMaterial({ color: 0x555555 }));
  box.position.y = HALL.h / 2; scene.add(box);
  const walls = new THREE.Mesh(new THREE.BoxGeometry(HALL.w, HALL.h, HALL.l), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.025, side: THREE.BackSide }));
  walls.position.y = HALL.h / 2; scene.add(walls);
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  pad.rotation.x = -Math.PI / 2; pad.position.copy(V(START.x, START.y, 0.004)); scene.add(pad);
  const padIn = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  padIn.rotation.x = -Math.PI / 2; padIn.position.copy(V(START.x, START.y, 0.006)); scene.add(padIn);
  { // the pilots stand outside the box, below the bottom wall, looking up the hall
    const c = document.createElement('canvas'); c.width = 512; c.height = 96;
    const x = c.getContext('2d'); x.fillStyle = '#9a9a9a'; x.font = '800 64px "Big Shoulders", Impact, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(tr('▲ PILOTS ▲'), 256, 50);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.75), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sign.rotation.x = -Math.PI / 2; sign.position.copy(V(HALL.w / 2, -0.9, 0.01)); scene.add(sign);
  }
  // the three rails under the ceiling: pairs of cables the rings clip onto
  const cableMat = new THREE.LineBasicMaterial({ color: 0x7fc8ff, transparent: true, opacity: 0.55 });
  for (const x of RAILS) for (const dx of [-0.06, 0.06]) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(x + dx, 0, HALL.h - 0.03), V(x + dx, HALL.l, HALL.h - 0.03)]), cableMat));
  const group = new THREE.Group(); scene.add(group);
  const whoop = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  scene.add(whoop);
  // the next piece lights up: green from the side you fly in from, red from the wrong side
  const gIn = new THREE.MeshBasicMaterial({ color: 0x4ade80 }), gOut = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
  const fillIn = new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.32, side: THREE.BackSide, depthWrite: false });
  const fillOut = new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.32, side: THREE.FrontSide, depthWrite: false });
  const two = (outline, fill) => { // local +z = the way through
    const g = new THREE.Group(), a = outline(gIn), b = outline(gOut);
    a.position.z = -0.025; b.position.z = 0.025;
    g.add(a, b, new THREE.Mesh(fill, fillIn), new THREE.Mesh(fill, fillOut));
    return g;
  };
  const glow = new THREE.Group();
  const glowSq = two((m) => frameMesh(0.5, 0.5, 0.04, m), new THREE.PlaneGeometry(0.5, 0.5));
  const glowRing = two((m) => new THREE.Mesh(new THREE.TorusGeometry(0.27, 0.03, 8, 40), m), new THREE.CircleGeometry(0.26, 40));
  glow.add(glowSq, glowRing); glow.visible = false; scene.add(glow);
  // the piece picked in the editor: an orange ring on the floor round it
  const pick = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.6, 40), new THREE.MeshBasicMaterial({ color: 0xff6b00, side: THREE.DoubleSide }));
  pick.rotation.x = -Math.PI / 2; pick.visible = false; scene.add(pick);
  function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();
  let last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (track && track.curve) {
      const speed = 4.5;                                      // m/s, a calm whoop
      if (!reduceMotion || mode === 'ride') rideT = (rideT + (dt * speed) / track.cur.facts.length) % 1;
      const p = track.curve.getPointAt(rideT);
      whoop.position.copy(p);
      const seq = track.seq || [];
      if (seq.length) {
        const sNow = rideT * track.cur.facts.length;
        const e = seq.find((q) => q.s > sNow + 0.05) || seq[0];
        glow.visible = true;
        glow.position.copy(V(e.x, e.y, e.h));
        glow.rotation.y = e.yaw;
        glowRing.visible = e.type === 'ring'; glowSq.visible = !glowRing.visible;
        glow.scale.setScalar((e.type === 'cube' ? 1.5 : 1.08) * (1 + 0.05 * Math.sin(now / 140)));
      } else glow.visible = false;
      if (mode === 'ride') {
        const ahead = track.curve.getPointAt((rideT + 0.6 / track.cur.facts.length) % 1);
        camera.position.copy(p).add(new THREE.Vector3(0, 0.14, 0));   // a little above the line, so it shows ahead
        camera.lookAt(ahead.x, ahead.y + 0.08, ahead.z);
        whoop.visible = false;
      } else { whoop.visible = true; controls.update(); }
      const pc = editing && picked >= 0 ? track.pieces[picked] : null;
      pick.visible = !!pc && mode !== 'ride';
      if (pc) pick.position.copy(V(pc.x, pc.y, 0.01));
    } else { controls.update(); glow.visible = false; whoop.visible = false; pick.visible = false; }
    renderer.render(scene, camera);
  });
  return { renderer, scene, camera, controls, group };
}

function frameMesh(w, h, t, mat) { // a square opening w × h, tube t thick, centred on the origin, facing +z
  const g = new THREE.Group();
  const add = (sx, sy, x, y) => { const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, t), mat); m.position.set(x, y, 0); g.add(m); };
  add(w + 2 * t, t, 0, h / 2 + t / 2); add(w + 2 * t, t, 0, -h / 2 - t / 2);
  add(t, h, -w / 2 - t / 2, 0); add(t, h, w / 2 + t / 2, 0);
  return g;
}
function draw3d(tr0) {
  if (!three) return;
  const { group } = three;
  while (group.children.length) group.remove(group.children[0]);
  if (!tr0) return;
  const white = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const orange = new THREE.MeshLambertMaterial({ color: 0xff6b00 });
  const green = new THREE.MeshLambertMaterial({ color: 0x22c55e });
  const blue = new THREE.MeshLambertMaterial({ color: 0x7fc8ff });
  const T = 0.03;
  tr0.pieces.forEach((pc, i) => {
    const pass = tr0.passes[i], obj = new THREE.Group();
    const yaw = Math.atan2(pass.dx, -pass.dy); // turns the piece's +z to the way it is flown
    if (pc.type === 'gate' || pc.type === 'timing') {
      const f = frameMesh(0.5, 0.5, T, pc.type === 'timing' ? green : white); f.position.y = 0.25 + T; obj.add(f);
    } else if (pc.type.startsWith('ladder')) {
      const k = pc.type === 'ladder3' ? 3 : 5;
      const flown = tr0.levels[level].passes[i].map((ps) => (ps.info && ps.info.stage != null ? ps.info.stage : -1));
      for (let s = 0; s < k; s++) { const f = frameMesh(0.5, 0.5, T, flown.includes(s) ? orange : white); f.position.y = 0.25 + T + s * (0.5 + T); obj.add(f); }
    } else if (pc.type === 'cube') {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.7, 0.7, 0.7)), new THREE.LineBasicMaterial({ color: 0xffffff }));

  for (let x = 1; x < HALL.w; x++) g += `<line x1="${px({ x })}" x2="${px({ x })}" y1="${P}" y2="${P + HALL.l * S}" stroke="${x % 5 ? '#161616' : '#262626'}"/>`;

  for (const x of RAILS) g += `<line x1="${px({ x })}" x2="${px({ x })}" y1="${P}" y2="${P + HALL.l * S}" stroke="#7fc8ff" stroke-opacity=".35" stroke-dasharray="2 5"/>`;

    let d = '';

    g += `<path d="${d}Z" fill="none" stroke="#ff6b00" stroke-width="2.4" stroke-linejoin="round"/>`;
  }
  g += `<path d="M${px(START)},${py(START)} L${px(START)},${py({ y: START.y + 1.5 })} L${px(TIMING)},${py({ y: TIMING.y - 3 })} L${px(TIMING)},${py(TIMING)}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g += `<rect x="${px(START) - 8}" y="${py(START) - 8}" width="16" height="16" fill="none" stroke="#fff" stroke-width="2"/><text x="${px(START) - 12}" y="${py(START) + 4}" text-anchor="end" fill="#fff" font-size="11" font-family="var(--display)" font-weight="800">START</text>`;
  if (t) {

      const pass = t.passes[i], ang = Math.atan2(pass.dx, pass.dy) * 180 / Math.PI;

// ---------- set-up list ----------
const LABEL = { timing: 'Timing gate', gate: 'Gate', cube: 'Cube', ring: 'Ring', ladder3: 'Ladder ×3', ladder5: 'Ladder ×5', flag: 'Flag' };

const FACES_ET = { up: 'üles', down: 'alla', left: 'vasakule', right: 'paremale', 'up-right': 'üles paremale', 'up-left': 'üles vasakule', 'down-right': 'alla paremale', 'down-left': 'alla vasakule' };

function faces(pass) {

    return n > 1 ? tr(st[1] > st[0] ? 'climb: stages {a} → {b}, each one' : 'down: stages {a} → {b}, each one', { a: st[0], b: st[n - 1] }) : tr('stage {a} of {b}', { a: st[0], b: of });

$('plan').addEventListener('pointerdown', (ev) => {
  if (!editing || !track) return;
  const h = toHall(ev);
  let best = -1, bd = 0.9;
  track.pieces.forEach((pc, i) => { const d = Math.hypot(pc.x - h.x, pc.y - h.y); if (d < bd) { bd = d; best = i; } });
  if (best < 0) { picked = -1; renderSheet(); renderSel(); return; }
  const wasPicked = picked === best;
  picked = best;
  ev.preventDefault();
  $('plan').setPointerCapture(ev.pointerId);
  const c = current();
  drag = { i: best, start: h, from: { dx: 0, dy: 0, rot: 0, ...(c.edits[best] || {}) }, moved: false, wasPicked, before: c };
  renderSheet(); renderSel();
});
let dragFrame = 0;
$('plan').addEventListener('pointermove', (ev) => {
  if (!drag || track.pieces[drag.i].type === 'timing') return;
  const h = toHall(ev), dx = Math.round((h.x - drag.start.x) * 10) / 10, dy = Math.round((h.y - drag.start.y) * 10) / 10;
  if (!drag.moved && Math.hypot(dx, dy) < 0.15) return;
  drag.moved = true;
  if (dragFrame) return;
  dragFrame = requestAnimationFrame(() => {
    dragFrame = 0;
    if (!drag) return;
    const c = { ...drag.before, edits: { ...drag.before.edits, [drag.i]: { ...drag.from, dx: drag.from.dx + dx, dy: drag.from.dy + dy } } };
    c.edits = cleanEdits(c.edits, baseOf(c.seed, c.opts).pieces);
    apply(c, { keep3d: true });                              // the plan follows the finger; 3D on letting go
  });
});
const endDrag = () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) { undo.push(d.before); draw3d(track); renderSel(); return; }
  if (d.wasPicked && track.pieces[d.i].type !== 'timing') changeEdit(d.i, (x) => { x.rot = (x.rot + (track.pieces[d.i].type === 'ring' ? 90 : 15)) % 360; });
};
$('plan').addEventListener('pointerup', endDrag);
$('plan').addEventListener('pointercancel', endDrag);

// ---------- views ----------
$('viewOrbit').onclick = () => setView('orbit');
$('viewTop').onclick = () => setView('top');
$('viewRide').onclick = () => setView('ride');
$('level').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !b.dataset.v) return;
  level = b.dataset.v;
  for (const x of $('level').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
  show(track);
});

three = setup3d();
setView('orbit');
await loadSaved();
showToday();
if (params.get('edit') != null) setEditing(true);
</script>
