<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOBIzone track</title>
<!-- The track viewer (Janno 28.11.2026: "see it as we can on the kiosk, but only the track and the top view,
     without the top menu and the set-up list"). Every path is relative, so the same page works on the race PC
     (/trackview) and copied to sim.hobizone.org (tools/copy-viewer.mjs). The track: #t=<packTrack>, else
     today's track from the race PC (/api/track), else the newest in the sim's /tracks.json (its doc). -->
<!-- three.js r128 (MIT, assets/vendor/LICENSE-three.txt) -->
<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/three-orbitcontrols.js"></script>
<style>
@font-face { font-family: 'Big Shoulders'; src: url(assets/fonts/big-shoulders-display-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+25A0-25FF; }
@font-face { font-family: 'Big Shoulders'; src: url(assets/fonts/big-shoulders-display-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: 'Big Shoulders Stencil'; src: url(assets/fonts/big-shoulders-stencil-display-latin-900-normal.woff2) format('woff2'); font-weight: 900; }
@font-face { font-family: 'Archivo'; src: url(assets/fonts/archivo-latin-standard-normal.woff2) format('woff2'); font-weight: 100 900; }
:root { --bg: #000; --panel: #111; --line: #2a2a2a; --text: #fff; --muted: #9a9a9a; --accent: #ff6b00; --display: 'Big Shoulders', 'Arial Narrow', Impact, sans-serif; --stencil: 'Big Shoulders Stencil', 'Big Shoulders', Impact, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Archivo', system-ui, sans-serif; }
body { display: grid; grid-template-columns: minmax(0, 1fr) auto; height: 100dvh; overflow: hidden; }
.stage { position: relative; background: #050505; overflow: hidden; touch-action: none; min-height: 0; }
.stage canvas { display: block; width: 100%; height: 100%; }
.side { height: 100dvh; padding: 14px 14px 14px 0; display: flex; }
.side svg { height: 100%; width: auto; display: block; background: #0b0b0b; }
.top { position: absolute; z-index: 2; left: 14px; top: 12px; right: 14px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.ttl { display: grid; gap: 4px; }
.ttl .k { font: 800 14px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.ttl h1 { margin: 0; font: 900 clamp(28px, 4vw, 48px)/.9 var(--stencil); text-transform: uppercase; letter-spacing: .02em; }
.spacer { flex: 1; }
.btn { all: unset; pointer-events: auto; cursor: pointer; background: rgba(0, 0, 0, .75); border: 1px solid var(--line); padding: 11px 15px; font: 800 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--text); clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn[hidden] { display: none; }
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.close { background: var(--accent); color: #000; border-color: var(--accent); }
.hud { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hud .lbl { font: 800 13px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.help { position: absolute; left: 14px; right: 14px; bottom: 10px; font-size: 13px; color: var(--muted); pointer-events: none; }
.help span { background: rgba(0, 0, 0, .6); padding: 3px 9px; }
.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; color: var(--muted); font: 700 20px/1.3 var(--display); letter-spacing: .06em; text-transform: uppercase; }
/* upright screens (phones): the 3D on top, the plan turned a quarter underneath */
@media (max-aspect-ratio: 1/1) {
  body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .side { height: auto; padding: 0 10px 10px; }
  .side svg { width: 100%; height: auto; max-height: 38dvh; }
  .hud .btn { padding: 9px 11px; font-size: 15px; }
}
/* ?plan=1: only the floor plan, turned to fill a landscape box (the sim's front page) */
body.plan-only { display: block; background: transparent; }
body.plan-only .stage { display: none; }
body.plan-only .side { height: 100dvh; padding: 0; justify-content: center; }
body.plan-only .side svg { width: 100%; height: 100%; background: transparent; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top">
    <div class="ttl"><span class="k" data-w="Today's track"></span><h1 id="code"></h1></div>
    <span class="spacer"></span>
    <button type="button" class="btn close" id="closeBtn" hidden data-w="Close"></button>
  </div>
  <div class="hud">
    <div role="group" id="views">
      <button type="button" class="btn" data-v="orbit" aria-pressed="true" data-w="Explore"></button>
      <button type="button" class="btn" data-v="ride" aria-pressed="false" data-w="Ride the line"></button>
      <button type="button" class="btn" data-v="top" aria-pressed="false" data-w="From above"></button>
    </div>
    <div role="group" id="levels">
      <span class="lbl" data-w="Fly it as"></span>
      <button type="button" class="btn" data-v="easy" aria-pressed="false" data-w="Beginner"></button>
      <button type="button" class="btn" data-v="full" aria-pressed="true">Pro</button>
    </div>
  </div>
  <div class="help"><span id="help"></span></div>
</div>
<aside class="side" id="plan"></aside>
<script type="module">
import { HALL, RAILS, START, TIMING, TYPES, OPEN, GATE_Z, HEX, CUBE_Z, code, rebuild, unpackTrack } from './assets/trackgen.js';
import { planSvg } from './assets/trackplan.js';
import { buildHall } from './assets/hall3d.js';
import { pieceMats, pieceObject, yawOf, numberSprite, frameMesh, hexMesh } from './assets/pieces3d.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const PLAN_ONLY = params.get('plan') === '1';
if (PLAN_ONLY) document.body.classList.add('plan-only');
let lang = params.get('lang');
if (lang !== 'et' && lang !== 'en') { try { lang = localStorage.getItem('tgiflyday.lang') || localStorage.getItem('hzsim.lang'); } catch {} }
if (lang !== 'et') lang = 'en';
document.documentElement.lang = lang;
const ET = {
  "Today's track": 'Tänane rada', "This week's track": 'Selle nädala rada', 'Close': 'Sulge', 'Explore': 'Vaata ringi', 'Ride the line': 'Lenda joonel', 'From above': 'Ülevalt',
  'Fly it as': 'Tase', 'Beginner': 'Algaja', 'Floor plan': 'Põhiplaan', 'No track to show yet.': 'Rada pole veel üleval.',
  'Drag to turn · pinch or scroll to zoom · two fingers or right-drag to move': 'Lohista pööramiseks · suumi kahe sõrmega või rulliga · liiguta kahe sõrme või parema hiirenupuga',
  'Riding the racing line · the next piece lights up: green on the side you fly in, red on the wrong side': 'Lendad võidujoonel · järgmine element süttib: roheline sealt, kust sisse lendad, punane valelt poolt',
};
const w = (s) => (lang === 'et' && ET[s]) || s;
for (const n of document.querySelectorAll('[data-w]')) n.textContent = w(n.dataset.w);
// opened from another page (the sim's front page): Close goes back to it
if (params.get('back') === '1') { $('closeBtn').hidden = false; $('closeBtn').onclick = () => { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) history.back(); else location.href = '/'; }; }
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('closeBtn').hidden) $('closeBtn').click(); });

let week = params.get('week') === '1';   // the sim says "this week's track"
let track = null, level = 'full', mode = 'orbit', rideT = 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V = (x, y, z) => new THREE.Vector3(x - HALL.w / 2, z, HALL.l / 2 - y);
const turned = () => PLAN_ONLY ? innerWidth > innerHeight : matchMedia('(max-aspect-ratio: 1/1)').matches;
const drawPlan = () => { $('plan').innerHTML = planSvg(track, { level, turned: turned(), label: w('Floor plan') }).replace(/>(▲ |◀ )PILOTS( ▲)?</, (m, a, b) => `>${a}${lang === 'et' ? 'PILOODID' : 'PILOTS'}${b || ''}<`); };
addEventListener('resize', () => { clearTimeout(drawPlan.t); drawPlan.t = setTimeout(drawPlan, 150); });

// ---------- where the track comes from ----------
const getJson = (u) => fetch(u, { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
async function findTrack() {
  const t = /(?:^|[#&])t=([zj]\.[A-Za-z0-9_-]+)/.exec(location.hash);
  if (t) return unpackTrack(t[1]);
  const pc = await getJson('/api/track');                 // on the race PC
  if (pc && pc.today) return pc.today;
  week = true;
  const list = await getJson('/tracks.json');             // on sim.hobizone.org: the newest with its doc
  const doc = list && Array.isArray(list.tracks) ? list.tracks.map((x) => x && x.doc).find(Boolean) : null;
  return typeof doc === 'string' ? unpackTrack(doc) : doc;
}
const wallNames = () => getJson('/api/track').then((d) => (d && Array.isArray(d.wallNames) ? d.wallNames : null))
  .then((n) => n || getJson('/api/hz/tgiflyday/wall-names').then((d) => (d && Array.isArray(d.names) ? d.names : [])));

// ---------- 3D (the kiosk's track page without the editor) ----------
let three = null;
function setup3d() {
  const stage = $('stage');
  if (!window.THREE || !THREE.OrbitControls) return null;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch { return null; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.Fog(0x050505, 30, 60);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.03, 200);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 2; controls.maxDistance = 45;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(6, 12, 8); scene.add(sun);
  buildHall(scene, V, { names: wallNames() });
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  pad.rotation.x = -Math.PI / 2; pad.position.copy(V(START.x, START.y, 0.004)); scene.add(pad);
  const padIn = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  padIn.rotation.x = -Math.PI / 2; padIn.position.copy(V(START.x, START.y, 0.006)); scene.add(padIn);
  {
    const c = document.createElement('canvas'); c.width = 512; c.height = 96;
    const x = c.getContext('2d'); x.fillStyle = '#9a9a9a'; x.font = '800 64px "Big Shoulders", Impact, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(lang === 'et' ? '▲ PILOODID ▲' : '▲ PILOTS ▲', 256, 50);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.75), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sign.rotation.x = -Math.PI / 2; sign.position.copy(V(HALL.w / 2, -1.4, 0.014)); scene.add(sign);
  }
  const cableMat = new THREE.LineBasicMaterial({ color: 0x7fc8ff, transparent: true, opacity: 0.55 });
  for (const x of RAILS) for (const dx of [-0.06, 0.06]) scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(x + dx, 0, HALL.h - 0.03), V(x + dx, HALL.l, HALL.h - 0.03)]), cableMat));
  const group = new THREE.Group(); scene.add(group);
  const whoop = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  scene.add(whoop);
  const gIn = new THREE.MeshBasicMaterial({ color: 0x4ade80 }), gOut = new THREE.MeshBasicMaterial({ color: 0xff3b30 });
  const fillIn = new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.32, side: THREE.BackSide, depthWrite: false });
  const fillOut = new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.32, side: THREE.FrontSide, depthWrite: false });
  const two = (outline, fill) => {
    const g = new THREE.Group(), a = outline(gIn), b = outline(gOut);
    a.position.z = -0.025; b.position.z = 0.025;
    g.add(a, b, new THREE.Mesh(fill, fillIn), new THREE.Mesh(fill, fillOut));
    return g;
  };
  const glow = new THREE.Group();
  const glowSq = two((m) => frameMesh(OPEN, OPEN, 0.04, m), new THREE.PlaneGeometry(OPEN, OPEN));
  const glowRing = two((m) => new THREE.Mesh(new THREE.TorusGeometry(OPEN / 2 + 0.02, 0.03, 8, 40), m), new THREE.CircleGeometry(OPEN / 2 + 0.01, 40));
  const glowHex = two((m) => hexMesh(m, 0.035), new THREE.CircleGeometry(HEX.inside / 2, 6));
  glow.add(glowSq, glowRing, glowHex); glow.visible = false; scene.add(glow);
  function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
  new ResizeObserver(resize).observe(stage); resize();
  let last = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (track && track.curve) {
      if (!reduceMotion || mode === 'ride') rideT = (rideT + (dt * 4.5) / track.cur.facts.length) % 1;
      const p = track.curve.getPointAt(rideT);
      whoop.position.copy(p);
      const seq = track.seq || [];
      if (seq.length) {
        const sNow = rideT * track.cur.facts.length;
        const e = seq.find((q) => q.s > sNow + 0.05) || seq[0];
        glow.visible = true; glow.position.copy(V(e.x, e.y, e.h)); glow.rotation.y = e.yaw;
        glowRing.visible = e.type === 'ring' || e.type === 'ladder3'; glowHex.visible = e.type === 'ladder5'; glowSq.visible = !glowRing.visible && !glowHex.visible;
        glow.scale.setScalar((e.type === 'cube' ? 1.5 : 1.08) * (1 + 0.05 * Math.sin(now / 140)));
      } else glow.visible = false;
      if (mode === 'ride') {
        const ahead = track.curve.getPointAt((rideT + 0.6 / track.cur.facts.length) % 1);
        camera.position.copy(p).add(new THREE.Vector3(0, 0.14, 0));
        camera.lookAt(ahead.x, ahead.y + 0.08, ahead.z);
        whoop.visible = false;
      } else { whoop.visible = true; controls.update(); }
    } else { controls.update(); glow.visible = false; whoop.visible = false; }
    renderer.render(scene, camera);
  });
  return { renderer, scene, camera, controls, group };
}

function draw3d() {
  if (!three || !track) return;
  const { group } = three, tr0 = track;
  while (group.children.length) group.remove(group.children[0]);
  const M = pieceMats();
  tr0.pieces.forEach((pc, i) => {
    const obj = pieceObject(pc, i, tr0, level, M);
    obj.position.copy(V(pc.x, pc.y, pc.lift || 0));
    obj.rotation.y = yawOf(tr0.passes[i]);
    group.add(obj);
    const sp = numberSprite(i + 1, pc.type === 'timing');
    sp.position.copy(V(pc.x, pc.y, Math.min(HALL.h - 0.05, TYPES[pc.type].zmax + 0.3 + (pc.lift || 0))));
    if (pc.type === 'ring') sp.position.y = pc.z - 0.45;
    sp.userData.label = true; group.add(sp);
  });
  tr0.cur = tr0.levels[level];
  const curve = new THREE.CatmullRomCurve3(tr0.cur.line.pts.filter((_, i) => i % 2 === 0).map((p) => V(p.x, p.y, p.z)), true, 'centripetal');
  tr0.curve = curve;
  const segs = Math.ceil(tr0.cur.facts.length * 8);
  const tube = new THREE.TubeGeometry(curve, segs, 0.025, 6, true);
  const cols = [], pos = tube.attributes.position, lo = new THREE.Color(0xff6b00), hi = new THREE.Color(0xffd6a8);
  for (let i = 0; i < pos.count; i++) { const c = lo.clone().lerp(hi, Math.max(0, Math.min(1, pos.getY(i) / 3))); cols.push(c.r, c.g, c.b); }
  tube.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const tubeMesh = new THREE.Mesh(tube, new THREE.MeshBasicMaterial({ vertexColors: true })); tubeMesh.userData.line = true; group.add(tubeMesh);
  const thin = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, 0.011, 6, true), new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.5, depthWrite: false }));
  thin.geometry.setAttribute('color', tube.getAttribute('color').clone()); thin.userData.rideLine = true; group.add(thin);
  const lead = new THREE.CatmullRomCurve3([V(START.x, START.y, 0.05), V(START.x, START.y + 1.5, 0.35), V(TIMING.x, TIMING.y - 3, 0.3), V(TIMING.x, TIMING.y, GATE_Z)]);
  const leadLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(lead.getPoints(60)), new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.25, gapSize: 0.18 }));
  leadLine.computeLineDistances(); group.add(leadLine);
  tr0.seq = [];
  tr0.pieces.forEach((pc, i) => (tr0.cur.passes[i] || []).forEach((ps) => {
    const st = ps.info && ps.info.stage != null ? ps.info.stage : pc.level || 0;
    const h = pc.type === 'ring' ? pc.z : pc.type === 'cube' ? CUBE_Z : pc.type.startsWith('ladder') ? TYPES[pc.type].levels[st] : GATE_Z;
    tr0.seq.push({ s: ps.s, type: pc.type, x: pc.x, y: pc.y, h: h + (pc.lift || 0), yaw: Math.atan2(ps.dx, -ps.dy) });
  }));
  tr0.seq.sort((a, b) => a.s - b.s);
  setView(mode, true);
}

function setView(m, keep) {
  const changed = m !== mode; mode = m;
  for (const b of $('views').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === m));
  $('help').textContent = w(m === 'ride' ? 'Riding the racing line · the next piece lights up: green on the side you fly in, red on the wrong side' : 'Drag to turn · pinch or scroll to zoom · two fingers or right-drag to move');
  if (!three) return;
  three.group.children.forEach((o) => { if (o.userData.line || o.userData.label) o.visible = m !== 'ride'; if (o.userData.rideLine) o.visible = m === 'ride'; });
  const { camera, controls } = three;
  camera.fov = m === 'ride' ? 78 : 50; camera.updateProjectionMatrix();
  controls.enabled = m !== 'ride';
  if (keep && !changed) return;
  if (m === 'orbit') { camera.position.set(11, 10, 23); controls.target.set(0, 0.6, 1.5); }
  if (m === 'top') { camera.position.set(0, 30, 0.01); controls.target.set(0, 0, 0); }
  camera.up.set(0, 1, 0); controls.update();
}
$('views').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
$('levels').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  level = b.dataset.v;
  for (const x of $('levels').querySelectorAll('button')) x.setAttribute('aria-pressed', String(x.dataset.v === level));
  draw3d(); drawPlan();
});

// ---------- go ----------
if (!PLAN_ONLY) three = setup3d();
const saved = await findTrack();
track = saved ? rebuild(saved) : null;
document.querySelector('.ttl .k').textContent = w(week ? "This week's track" : "Today's track");
if (track) { $('code').textContent = code(saved.seed >>> 0); document.title = `${code(saved.seed >>> 0)} · HOBIzone`; }
else if (!PLAN_ONLY) $('stage').insertAdjacentHTML('beforeend', `<div class="msg">${w('No track to show yet.')}</div>`);
drawPlan();
if (!PLAN_ONLY) { draw3d(); setView('orbit'); }
window.__tv = { ready: !!track, three };
</script>
</body>
</html>
